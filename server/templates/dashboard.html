<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIDS Dashboard</title>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0d1117',
                        panelBg: '#161b22',
                        accentGreen: '#00ff9c',
                        accentRed: '#ff4b2b',
                        textGray: '#8b949e',
                        borderGray: '#30363d',
                        logBg: '#010409'
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'Tahoma', 'Geneva', 'Verdana', 'sans-serif'],
                        mono: ['Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }
    </style>
</head>
<body class="bg-bgDark text-white font-sans h-screen p-5 flex flex-col box-border overflow-hidden">
    
    <div class="bg-panelBg border border-borderGray rounded-lg p-4 mb-5 flex items-center gap-4">
        <select id="interfaceSelect" class="bg-bgDark border border-borderGray p-2 rounded text-white min-w-[200px]">
            <option>Loading interfaces...</option>
        </select>

        <button onclick="startMonitoring()" id="btnStart"
            class="bg-accentGreen hover:bg-accentGreen/80 transition text-black px-4 py-2 rounded font-semibold">
            Start Monitoring
        </button>

        <button onclick="stopMonitoring()" id="btnStop" disabled
            class="bg-accentRed hover:bg-accentRed/80 transition text-white px-4 py-2 rounded font-semibold opacity-50 cursor-not-allowed">
            Stop
        </button>

        <span id="currentInterface" class="text-textGray ml-4 font-mono"></span>
    </div>

    <div id="statusBanner" class="p-4 rounded-lg flex justify-between items-center border-2 mb-5 transition-all duration-300 border-accentGreen bg-accentGreen/10">
        <div id="statusTitle" class="text-2xl font-bold text-accentGreen flex items-center gap-3">
            <i class="fas fa-shield-check"></i> SYSTEM SECURE - MONITORING TRAFFIC
        </div>
        
        <div class="hidden gap-8 items-center text-lg" id="incidentStats">
            <div class="flex flex-col">
                <span class="text-textGray text-sm">Threat Type</span>
                <strong id="incType" class="font-mono text-xl">--</strong>
            </div>
            <div class="flex flex-col">
                <span class="text-textGray text-sm">Source IP</span>
                <strong id="incIp" class="font-mono text-xl">--</strong>
            </div>
            <div class="flex flex-col">
                <span class="text-textGray text-sm">Alerts Generated</span>
                <strong id="incAlerts" class="text-accentRed font-mono text-2xl">0</strong>
            </div>
            <button id="btnResolve" class="hidden bg-borderGray hover:bg-textGray hover:text-black text-white border border-textGray px-4 py-2 rounded font-semibold transition-colors" onclick="resolveIncident()">
                Clear Alert
            </button>
        </div>
    </div>

    <div class="grid grid-cols-3 grid-rows-[auto_1fr] gap-5 flex-1 min-h-0">
        <div class="bg-panelBg border border-borderGray rounded-lg p-4 flex flex-col col-span-2 row-span-1 shadow-lg">
            <h3 class="m-0 mb-4 text-gray-300 text-lg border-b border-borderGray pb-2 flex items-center gap-2">
                <i class="fas fa-chart-area"></i> Live Network Traffic (Packets/s)
            </h3>
            <div class="h-48 relative w-full">
                <canvas id="trafficChart"></canvas>
            </div>
        </div>

        <div class="bg-panelBg border border-borderGray rounded-lg p-4 flex flex-col col-span-1 row-span-2 shadow-lg">
            <h3 class="m-0 mb-4 text-gray-300 text-lg border-b border-borderGray pb-2 flex items-center gap-2">
                <i class="fas fa-terminal"></i> System Logs
            </h3>
            <div id="logs" class="flex-1 bg-logBg font-mono p-3 overflow-y-auto rounded text-sm text-gray-300"></div>
        </div>

        <div class="bg-panelBg border border-borderGray rounded-lg p-4 flex flex-col col-span-2 row-span-1 shadow-lg min-h-0">
            <h3 class="m-0 mb-4 text-gray-300 text-lg border-b border-borderGray pb-2 flex items-center gap-2">
                <i class="fas fa-exchange-alt"></i> Live Flow Analysis
            </h3>
            <div class="flex-1 overflow-y-auto pr-2">
                <table class="w-full border-collapse text-left font-mono text-sm">
                    <thead class="sticky top-0 bg-panelBg shadow-[0_2px_0_#30363d]">
                        <tr>
                            <th class="text-textGray p-2 font-normal">Source</th>
                            <th class="text-textGray p-2 font-normal"></th>
                            <th class="text-textGray p-2 font-normal">Destination</th>
                            <th class="text-textGray p-2 font-normal">Proto</th>
                            <th class="text-textGray p-2 font-normal">Duration</th>
                            <th class="text-textGray p-2 font-normal">Status</th>
                        </tr>
                    </thead>
                    <tbody id="flowBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const socket = io();
    
    let isUnderAttack = false;
    let currentAlertCount = 0;

    const safeBannerClass = "p-4 rounded-lg flex justify-between items-center border-2 mb-5 transition-all duration-300 border-accentGreen bg-accentGreen/10";
    const attackBannerClass = "p-4 rounded-lg flex justify-between items-center border-2 mb-5 transition-all duration-300 border-accentRed bg-accentRed/10 shadow-[0_0_15px_rgba(255,75,43,0.2)]";

    const ctx = document.getElementById('trafficChart').getContext('2d');
    const trafficChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array(30).fill(""), 
            datasets: [{
                label: 'Packets/s',
                borderColor: '#00ff9c',
                borderWidth: 2,
                data: Array(30).fill(0),
                fill: true,
                backgroundColor: 'rgba(0, 255, 156, 0.05)',
                tension: 0.3,
                pointRadius: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { display: false },
                y: { beginAtZero: true, grid: { color: '#30363d' } }
            }
        }
    });

    function log(msg, isWarn = false) {
        const logs = document.getElementById("logs");
        const div = document.createElement("div");
        div.className = `mb-1 ${isWarn ? "text-accentRed" : ""}`;
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logs.prepend(div);
    }

    function resolveIncident() {
        log(`Analyst cleared alert. Total incident alerts: ${currentAlertCount}`);
        isUnderAttack = false;
        currentAlertCount = 0;
        
        document.getElementById("statusBanner").className = safeBannerClass;
        document.getElementById("statusTitle").innerHTML = `<i class="fas fa-shield-check"></i> SYSTEM SECURE`;
        document.getElementById("statusTitle").className = "text-2xl font-bold text-accentGreen flex items-center gap-3";
        
        document.getElementById("incidentStats").classList.remove("flex");
        document.getElementById("incidentStats").classList.add("hidden");
        document.getElementById("btnResolve").classList.add("hidden");
        
        trafficChart.data.datasets[0].borderColor = '#00ff9c';
        trafficChart.data.datasets[0].backgroundColor = 'rgba(0, 255, 156, 0.05)';
        trafficChart.update();
    }

    socket.on("new_prediction", (data) => {
        // 1. Update Chart
        trafficChart.data.labels.shift();
        trafficChart.data.labels.push("");
        trafficChart.data.datasets[0].data.shift();
        trafficChart.data.datasets[0].data.push(data["Flow Packets/s"]);
        trafficChart.update();

        const isAttack = data.prediction !== "BENIGN";

        // 2. Update Flow Table
        const tbody = document.getElementById("flowBody");
        const row = tbody.insertRow(0); 
        row.className = isAttack ? "text-accentRed" : "text-accentGreen";
        row.innerHTML = `
            <td class="p-2 border-b border-borderGray/50">${data.src_ip}:${data.src_port || 0}</td>
            <td class="p-2 border-b border-borderGray/50"><i class="fas fa-arrow-right opacity-50 text-xs"></i></td>
            <td class="p-2 border-b border-borderGray/50">${data.dst_ip}:${data.dst_port || 0}</td>
            <td class="p-2 border-b border-borderGray/50">${data.protocol}</td>
            <td class="p-2 border-b border-borderGray/50">${(data["Flow Duration"] || 0).toFixed(1)} ms</td>
            <td class="p-2 border-b border-borderGray/50 font-bold">${data.prediction}</td>
        `;

        if (tbody.rows.length > 15) { tbody.deleteRow(15); }

        // 3. Incident Logic
        if (isAttack) {
            if (!isUnderAttack) {
                isUnderAttack = true;
                currentAlertCount = 0;
                
                document.getElementById("statusBanner").className = attackBannerClass;
                document.getElementById("statusTitle").innerHTML = `<i class="fas fa-exclamation-triangle"></i> THREAT DETECTED`;
                document.getElementById("statusTitle").className = "text-2xl font-bold text-accentRed flex items-center gap-3";
                
                document.getElementById("incidentStats").classList.remove("hidden");
                document.getElementById("incidentStats").classList.add("flex");
                document.getElementById("btnResolve").classList.remove("hidden");
                
                document.getElementById("incType").innerText = data.prediction;
                document.getElementById("incIp").innerText = data.src_ip;
                
                trafficChart.data.datasets[0].borderColor = '#ff4b2b';
                trafficChart.data.datasets[0].backgroundColor = 'rgba(255, 75, 43, 0.1)';
                
                log(`CRITICAL: ${data.prediction} detected from ${data.src_ip}`, true);
            }
            
            currentAlertCount++;
            document.getElementById("incAlerts").innerText = currentAlertCount;
        }
    });

    // --- THESE FUNCTIONS ARE NOW CORRECTLY OUTSIDE THE SOCKET LISTENER ---
    
    async function loadInterfaces() {
        try {
            const res = await fetch("/interfaces");
            const data = await res.json();
            const select = document.getElementById("interfaceSelect");
            select.innerHTML = "";

            data.forEach(iface => {
                const option = document.createElement("option");
                option.value = iface;
                option.textContent = iface;
                select.appendChild(option);
            });
            log(`Loaded ${data.length} interfaces`);
        } catch (err) {
            console.error("Failed to load interfaces", err);
            log("Failed to load interfaces from server", true);
        }
    }

    async function startMonitoring() {
        const iface = document.getElementById("interfaceSelect").value;
        if (!iface) return;

        try {
            const res = await fetch("/start", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ interface: iface })
            });
            const data = await res.json();

            if (data.status === "started") {
                log(`Monitoring started on ${data.interface}`);
                document.getElementById("currentInterface").innerText = "Active: " + data.interface;
                
                // Toggle buttons
                document.getElementById("btnStart").disabled = true;
                document.getElementById("btnStart").classList.add("opacity-50", "cursor-not-allowed");
                document.getElementById("btnStop").disabled = false;
                document.getElementById("btnStop").classList.remove("opacity-50", "cursor-not-allowed");
                document.getElementById("interfaceSelect").disabled = true;
            } else {
                log("Failed to start monitoring: " + data.status, true);
            }
        } catch (err) {
            log("Server error starting monitor", true);
        }
    }

    async function stopMonitoring() {
        try {
            const res = await fetch("/stop", { method: "POST" });
            const data = await res.json();

            log("Monitoring stopped");
            document.getElementById("currentInterface").innerText = "Stopped";
            
            // Toggle buttons
            document.getElementById("btnStart").disabled = false;
            document.getElementById("btnStart").classList.remove("opacity-50", "cursor-not-allowed");
            document.getElementById("btnStop").disabled = true;
            document.getElementById("btnStop").classList.add("opacity-50", "cursor-not-allowed");
            document.getElementById("interfaceSelect").disabled = false;
        } catch (err) {
            log("Server error stopping monitor", true);
        }
    }

    // Auto-load interfaces on page startup
    window.onload = async () => {
        await loadInterfaces();
    };
</script>
</body>
</html>
